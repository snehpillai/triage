[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "triage"
version = "0.1.0"
description = "Multi-agent customer support automation system"
requires-python = ">=3.13"
dependencies = [
    # Core agent framework
    "langgraph>=0.2",
    "langchain-anthropic>=0.3",
    "langsmith>=0.1",

    # Anthropic SDK
    "anthropic>=0.40",

    # API layer
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",

    # Data models & config
    "pydantic>=2.9",
    "pydantic-settings>=2.6",

    # Database & vector search
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "sqlalchemy>=2.0",
    "alembic>=1.14",

    # Queue
    "redis>=5.2",

    # Embeddings (choose one; both listed for flexibility)
    "voyageai>=0.3",
    # "openai>=1.0",  # alternative embeddings provider

    # Observability
    "prometheus-client>=0.21",

    # Logging
    "loguru>=0.7",

    # Demo UI
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",      # async test client for FastAPI
    "respx>=0.21",      # mock httpx calls in tests
    "pre-commit>=4.0",
    "black>=24.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — black handles this
]

[tool.ruff.lint.isort]
known-first-party = ["triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
